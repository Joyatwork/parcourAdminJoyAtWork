# /etc/nginx/sites-available/parcour-admin
# Configuration Nginx pour reverse proxy - Parcour Admin

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name parcouadmin.joyatwork.com www.parcouadmin.joyatwork.com;
    
    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirection HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Server HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name parcouadmin.joyatwork.com www.parcouadmin.joyatwork.com;

    # Certificats SSL (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/parcouadmin.joyatwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parcouadmin.joyatwork.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/parcouadmin.joyatwork.com/chain.pem;

    # Configuration SSL sécurisée
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (optionnel mais recommandé)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/parcour-admin-access.log combined;
    error_log /var/log/nginx/parcour-admin-error.log;

    # Root du site (Frontend React)
    root /var/www/parcour-admin/hub;
    index index.html;

    # Gestion CORS et headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================
    # Frontend React - SPA routing
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache busting pour index.html
        if ($request_filename ~* ^.*?\.(html|json)$) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        # Cache pour assets (JS, CSS, images)
        if ($request_filename ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$) {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ==========================================
    # Backend API Laravel - Proxy vers port 8000
    # ==========================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Headers importants pour Laravel
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ==========================================
    # Endpoints spécifiques (admin, ws, etc.)
    # ==========================================
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support (si besoin)
    # location /ws/ {
    #     proxy_pass http://127.0.0.1:6001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # ==========================================
    # Health check / Monitoring
    # ==========================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==========================================
    # Performance & Sécurité
    # ==========================================

    # Bloquer les accès directs aux fichiers sensibles
    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    location ~ /storage/logs {
        deny all;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
    gzip_min_length 1000;
    gzip_disable "msie6";
}
